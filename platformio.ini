[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit INA219 @ ^1.2.3
    bogde/HX711 @ ^0.7.5
    Wire

build_flags =
    -DUSB_SERIAL
    -DLAYOUT_US_ENGLISH

monitor_speed = 115200
